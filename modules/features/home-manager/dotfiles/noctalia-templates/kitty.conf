# Rendered by Noctalia to ~/.config/kitty/themes/noctalia.conf on every
# palette change (see modules/features/home-manager/modules/desktop/theme.nix).
# Surfaces come from the wallpaper; red, green, yellow... are the Stylix
# scheme's accents tinted toward it, so they keep their meaning in diffs
# and prompts
background            {{colors.surface.default.hex}}
foreground            {{colors.on_surface.default.hex}}
cursor                {{colors.on_surface.default.hex}}
cursor_text_color     {{colors.surface.default.hex}}
selection_background  {{colors.surface_container_highest.default.hex}}
selection_foreground  {{colors.on_surface.default.hex}}
url_color             {{colors.primary.default.hex}}
cursor_trail_color    {{colors.on_surface_variant.default.hex}}

active_border_color   {{colors.primary.default.hex}}
inactive_border_color {{colors.surface_variant.default.hex}}

active_tab_foreground   {{colors.on_primary.default.hex}}
active_tab_background   {{colors.primary.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
inactive_tab_background {{colors.surface_variant.default.hex}}

# black
color0  {{colors.surface_container.default.hex}}
color8  {{colors.outline.default.hex}}
# red
color1  {{colors.red.default.hex}}
color9  {{colors.red.default.hex}}
# green
color2  {{colors.green.default.hex}}
color10 {{colors.green.default.hex}}
# yellow
color3  {{colors.yellow.default.hex}}
color11 {{colors.yellow.default.hex}}
# blue
color4  {{colors.blue.default.hex}}
color12 {{colors.blue.default.hex}}
# magenta
color5  {{colors.magenta.default.hex}}
color13 {{colors.magenta.default.hex}}
# cyan
color6  {{colors.cyan.default.hex}}
color14 {{colors.cyan.default.hex}}
# white
color7  {{colors.on_surface.default.hex}}
color15 {{colors.on_surface.default.hex}}

# Cells drawn with the theme background (e.g. neovim) get a lighter
# transparency than the default background (stylix.opacity.terminal)
transparent_background_colors {{colors.surface.default.hex}}@0.9
